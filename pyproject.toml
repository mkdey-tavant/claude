[project]
name = "stock-analysis-mcp"
version = "0.1.0"
description = "Production-grade MCP server for fundamental, technical, and risk analysis of NSE/BSE stocks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manoj Dey" }]
keywords = ["mcp", "stocks", "finance", "nse", "bse", "technical-analysis"]

dependencies = [
    "mcp[cli]>=1.2.0",
    "yfinance>=0.2.40",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "cachetools>=5.3.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
ui = [
    "flask>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
stock-analysis-mcp = "stock_analysis_mcp.server:main"
stock-analysis = "stock_analysis_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_analysis_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
